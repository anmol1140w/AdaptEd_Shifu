services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adapted
      POSTGRES_USER: adapted_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the platform start script once to generate .env}
    volumes:
      - adapted_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adapted_user -d adapted"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    volumes:
      # The adaptive learning route reads and writes approved question banks here.
      # Keep this bound to the repository so teacher approvals are visible to Git
      # and survive backend container recreation.
      - ./content:/content
    restart: unless-stopped
    environment:
      ADAPTED_DATABASE_URL: postgresql://adapted_user@db:5432/adapted
      ADAPTED_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run the platform start script once to generate .env}
      ADAPTED_SECRET_KEY: ${ADAPTED_SECRET_KEY:?Run the platform start script once to generate .env}
      ADAPTED_TEACHER_INVITE_CODE: ${ADAPTED_TEACHER_INVITE_CODE:-}
      ADAPTED_GOOGLE_CLIENT_ID: ${ADAPTED_GOOGLE_CLIENT_ID:-}
      ADAPTED_GOOGLE_CLIENT_SECRET: ${ADAPTED_GOOGLE_CLIENT_SECRET:-}
      ADAPTED_GOOGLE_REDIRECT_URI: ${ADAPTED_GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      ADAPTED_FRONTEND_URL: ${ADAPTED_FRONTEND_URL:-http://localhost:5173}
      ADAPTED_CORS_ORIGINS: ${ADAPTED_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADAPTED_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_OAUTH_ENABLED: ${VITE_GOOGLE_OAUTH_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ADAPTED_WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  adapted_postgres_data:
